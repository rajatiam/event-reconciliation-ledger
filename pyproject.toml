[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-reconciliation-ledger"
version = "1.0.0"
description = "Exact-money event ingestion, idempotency and settlement matching"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
event-reconciliation-ledger = "event_reconciliation_ledger:entrypoint"

[tool.setuptools.packages.find]
include = ["event_reconciliation_ledger*"]
